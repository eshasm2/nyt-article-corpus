name: Fetch Articles

on:
  workflow_dispatch:   # manual trigger, e.g. to kick off a run immediately
  schedule:
    - cron: "0 */5 * * *"   # every 5 hours; concurrency group below prevents overlap with a still-running job

concurrency:
  group: fetch-articles
  cancel-in-progress: false   # queue instead of killing in-flight fetch/commit work

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        run: python fetch_wayback.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add fetched/
          git diff --cached --quiet || git commit -m "chore: fetch articles [skip ci]"

          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i) — rebasing onto latest main and retrying."
            git fetch origin main
            git rebase origin/main
            sleep 5
          done

          python recompute_count.py
          git add count.json
          git diff --cached --quiet || git commit -m "chore: update count.json [skip ci]"

          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i) — rebasing onto latest main and retrying."
            git fetch origin main
            git rebase origin/main
            python recompute_count.py
            git add count.json
            git diff --cached --quiet || git commit --amend --no-edit
            sleep 5
          done
